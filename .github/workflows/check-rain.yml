# Free alternative to cron-job.org: pings the rain checker every 15 minutes.
#
# Setup (repo Settings → Secrets and variables → Actions):
#   Secret   CRON_SECRET  = the same value as your Vercel CRON_SECRET
#   Variable APP_URL      = https://your-app.vercel.app   (no trailing slash)
#
# Note: GitHub's scheduled triggers are best-effort and can be delayed several
# minutes under platform load. That's fine for laundry; use cron-job.org if you
# want tighter timing.
name: Check rain near home

on:
  schedule:
    - cron: "*/15 * * * *" # every 15 minutes (UTC; cadence is what matters here)
  workflow_dispatch: {} # allow manual runs from the Actions tab

# If a run overruns, don't pile up overlapping invocations.
concurrency:
  group: check-rain
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call the rain checker
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::APP_URL variable or CRON_SECRET secret is not set."
            exit 1
          fi
          code=$(curl -sS -o /tmp/body.json -w "%{http_code}" \
            --max-time 30 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL%/}/api/cron/check-rain")
          echo "HTTP $code"
          cat /tmp/body.json || true
          echo
          # Treat only 5xx / network failures as workflow failures; a 200 with
          # notified:false is a normal "no rain" result.
          if [ "$code" -ge 500 ] || [ "$code" -eq 000 ]; then
            echo "::error::Rain checker returned $code"
            exit 1
          fi
